name: dbt CI

# Runs the full pipeline and all 95 tests against an isolated `ci_*` set of
# datasets whenever a model, macro or project config changes. Production
# marts are never touched: the generate_schema_name macro prefixes every
# schema with the target's dataset for any target other than `dev`.

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'macros/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - '.github/workflows/dbt_ci.yml'
  pull_request:
    paths:
      - 'models/**'
      - 'macros/**'
      - 'dbt_project.yml'
      - 'packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for workload identity federation

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery==1.11.1

      # Exchanges GitHub's OIDC token for short-lived Google credentials.
      # No service account key is stored anywhere.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/560455219227/locations/global/workloadIdentityPools/github/providers/github-provider'
          service_account: 'github-ci@project-6781bf86-eb56-440c-84b.iam.gserviceaccount.com'

      # profiles.yml lives outside the repo by design, so the runner needs
      # its own. `method: oauth` resolves through Application Default
      # Credentials, which the auth step above has just populated.
      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          revenue_intelligence_platform:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: project-6781bf86-eb56-440c-84b
                dataset: ci
                threads: 4
                job_execution_timeout_seconds: 600
                job_retries: 1
                location: europe-west2
                priority: interactive
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Verify connection
        run: dbt debug --target ci

      # dbt build runs models and their tests in dependency order and stops
      # on the first failure, so a broken model never reaches the layers
      # below it.
      - name: Build models and run tests
        run: dbt build --target ci
